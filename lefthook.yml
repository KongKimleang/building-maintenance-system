pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: npx prettier --check "**/*.{js,jsx,json,css,md}"
    - name: eslint
      run: Frontend/node_modules/.bin/eslint Frontend/src/ --ext .js,.jsx --max-warnings=9999
    - name: cspell
      run: npx cspell "**/*.{js,jsx}" --no-progress

pre-push:
  jobs:
    - name: playwright
      run: echo "Remember to run playwright tests manually"